<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미소팜 덴탈 오더</title>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f4f4f4;
  color: #222;
}

.app {
  max-width: 430px;
  margin: 0 auto;
  background: #fff;
  min-height: 100vh;
}

.top {
  padding: 14px 12px 6px;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  background: #e8f4cf;
}

.logo {
  width: 32px;
  height: 32px;
  background: #4d8b25;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.search-row input {
  flex: 1;
  height: 32px;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 0 10px;
}

.nav {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: #f5f5e8;
  border-bottom: 1px solid #ccc;
}

.nav div {
  text-align: center;
  padding: 8px 2px;
  font-size: 11px;
  border-right: 1px solid #ddd;
}

.nav div span {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}

.banner {
  margin: 10px;
  background: linear-gradient(90deg, #ffe89a, #fff);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  align-items: center;
  border: 1px solid #ddd;
}

.banner img {
  width: 120px;
  height: 80px;
  object-fit: cover;
}

.banner-text {
  flex: 1;
  padding: 10px;
}

.banner-text h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.banner-text p {
  margin: 0;
  font-size: 11px;
}

.quick {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  font-size: 13px;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
}

.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px 10px;
  padding: 20px 12px;
}

.category {
  text-align: center;
  font-size: 11px;
  cursor: pointer;
}

.category .img {
  width: 74px;
  height: 54px;
  margin: 0 auto 6px;
  background: #eee;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.side-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 0 18px 15px;
}

.small-btn {
  width: 54px;
  height: 54px;
  border-radius: 6px;
  border: 1px solid #999;
  background: #fff;
  font-size: 12px;
  text-align: center;
}

.order-main {
  margin: 0 12px 14px;
  background: #486f23;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}

.notice {
  padding: 12px;
  font-size: 10px;
  color: #333;
  border-top: 1px solid #ddd;
  line-height: 1.6;
  text-align: center;
}

.form {
  display: none;
  padding: 16px;
  background: #fafafa;
  border-top: 2px solid #486f23;
}

  margin-top: 0;
}
