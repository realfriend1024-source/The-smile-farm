<! DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덴트오더</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

.header {
  background: #6c2bd9;
  color: white;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.button {
  background: #6c2bd9;
  color: white;
  padding: 15px;
  border: none;
  border-radius: 10px;
  width: 100%;
  font-size: 16px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  덴트오더 (치과 ↔ 기공소)
</div>

<div class="container">

  <div class="card">
    <h3>🦷 새 오더 생성</h3>
    <button class="button">오더 생성하기</button>
  </div>

  <div class="card">
    <h3>📦 진행중 오더</h3>
    <p>현재 진행중인 작업이 없습니다</p>
  </div>

</div>

</body>
</html>
