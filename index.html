<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>덴트오더</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}
.header {
  background: #6c2bd9;
  color: white;
  padding: 22px;
  font-size: 22px;
  font-weight: bold;
}
.container { padding: 20px; }
.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
.button {
  background: #6c2bd9;
  color: white;
  padding: 16px;
  border: none;
  border-radius: 12px;
  width: 100%;
  font-size: 17px;
  font-weight: bold;
  margin-top: 12px;
}
.input, select, textarea {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  margin-bottom: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  box-sizing: border-box;
}
label {
  font-weight: bold;
}
.hidden {
  display: none;
}
.order-box {
  background: #f0ebff;
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
}
</style>
</head>

<body>
<div class="header">덴트오더 (치과 ↔ 기공소)</div>

<div class="container">

  <div class="card">
    <h2>🦷 새 오더 생성</h2>
    <button class="button" onclick="showForm()">오더 생성하기</button>
  </div>

  <div id="orderForm" class="card hidden">
    <h2>오더 입력</h2>

    <label>환자명</label>
    <input id="patient" class="input" placeholder="예: 김OO">

    <label>차트번호</label>
    <input id="chart" class="input" placeholder="예: 24051">

    <label>치식</label>
    <input id="tooth" class="input" placeholder="예: 16">

    <label>보철 종류</label>
    <select id="item">
      <option>지르코니아 크라운</option>
      <option>PFM</option>
      <option>인레이</option>
      <option>임플란트 크라운</option>
      <option>라미네이트</option>
      <option>덴쳐</option>
    </select>

    <label>쉐이드</label>
      자리input  입력 =" 음영"  클래스 ="입력"=자리 표시자 ="예: A2">

    <label>요청사항</label>
    <textarea id="memo" rows="4" placeholder="컨택, 교합, 마진, 색조 요청 등"></textarea>

    <button class="button" onclick="submitOrder()">오더 제출</button>
  </div>

  <div class="card">
    <h2>📦 진행중 오더</h2>
    <div id="orders">현재 진행중인 작업이 없습니다</div>
  </div>

</div>

<script>
function showForm() {
  document.getElementById("orderForm").classList.remove("hidden");
}

function submitOrder() {
  const patient = document.getElementById("patient").value || "김OO";
  const chart = document.getElementById("chart").value || "-";
  const tooth = document.getElementById("tooth").value || "-";
  const item = document.getElementById("item").value;
  const shade = document.getElementById("shade").value || "-";
  const memo = document.getElementById("memo").value || "특이사항 없음";

  const orders = document.getElementById("orders");
  orders.innerHTML = `
    <div class="order-box">
      <b>${patient}</b><br>
      차트번호: ${chart}<br>
      치식: ${tooth}<br>
      보철: ${item}<br>
      쉐이드: ${shade}<br>
      요청사항: ${memo}<br>
      상태: 접수대기
    </div>
  `;

  document.getElementById("orderForm").classList.add("hidden");
}
</script>
</body>
</html>
